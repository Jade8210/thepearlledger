  <style>
:root {
  --ivory: #F6F0E8;
  --dust-rose: #CFA7A3;
  --cocoa: #4A342D;
  --pearl-gray: #B7B0A8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--ivory); color:var(--cocoa); font-family:'Inter',sans-serif; line-height:1.6; }
h1,h2,h3 { font-family:'Bodoni Moda',serif; font-weight:600; }
.app-container { width:90%; max-width:1200px; margin:auto; }
header { padding:30px 0; }
.logo { font-size:1.5rem; letter-spacing:1px; }
.hero { padding:100px 0; text-align:center; }
.hero h1 { font-size:4rem; margin-bottom:20px; }
.hero p { max-width:700px; margin:auto; font-size:1.1rem; color:var(--pearl-gray); }
.buttons { margin-top:30px; }
.btn { padding:14px 28px; border:none; text-decoration:none; margin:0 10px; border-radius:50px; font-weight:500; display:inline-block; }
.primary { background:var(--dust-rose); color:white; }
.secondary { border:1px solid var(--cocoa); color:var(--cocoa); }
section { padding:80px 0; }
.section-title { text-align:center; margin-bottom:50px; }
.services { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:30px; }
.card { background:white; padding:30px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.05); }
.card h3 { margin-bottom:15px; }
.card ul { list-style:none; }
.card ul li { margin-bottom:10px; }
.price { margin-top:20px; font-weight:bold; }
.about { text-align:center; max-width:800px; margin:auto; }
.about-section { display:flex; align-items:center; gap:50px; max-width:1000px; margin:auto; flex-direction:row; }
.about-section img { width:350px; height:350px; object-fit:cover; border-radius:20px; flex-shrink:0; }
.about-text { flex:1; text-align:left; }
.cta { text-align:center; background:var(--dust-rose); color:white; padding:80px 20px; border-radius:30px; }
footer { text-align:center; padding:40px 0; color:var(--pearl-gray); }
@media(max-width:768px) {
  .hero h1 { font-size:2.5rem; }
  .about-section { flex-direction:column; text-align:center; }
  .about-text { text-align:center; }
  .about-section img { width:100%; max-width:350px; }
}
</style>
